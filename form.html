<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
      body{
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: rgb(145, 145, 54);

        }
    .box{
        border: 1px solid rgb(181, 172, 172);
        margin-top: 200px;
        margin: right 200px;
        background-color: white;
        height: 300px;
        width: 400px;
        box-shadow: 0 4px 8px rgba(0.2, 0.2, 0.2, 0.2);;
        border-radius: 10px;
    }

        input{
            width: 250px;
            height: 30px;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 15px;
        }
        #btn{
            height: 40px;
            width: 180px;
            background-color: olivedrab;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 20px;
        }
        
    </style>
</head>
<body>
    <div class="box">

        <h2>Registration Form</h2>
        <form id="form1">
            <input type="text" placeholder="Enter Your Name" id="name"><br>
            <input type="Email" placeholder="Enter Your Email" id="email"><br>
            <input type="password" placeholder="Enter Your Password" id="pass"><br>
            <button type="submit" id="btn">submit</button>
        </form>
    </div>

    <script>
        let btn = document.getElementById("btn");
        let form = document.getElementById("form1");

        form.addEventListener("submit", function(e){
            e.preventDefault()
            let name = document.getElementById("name").value
            let email = document.getElementById("email").value
            let pass = document.getElementById("pass").value

            localStorage.setItem("name",name)
            localStorage.setItem("email",email)
            localStorage.setItem("pass",pass)
            

            if(name == "" || email == "" || pass == "" ){
                alert("please fill out all the fields")
            }
            let users = JSON.parse(localStorage.getItem("users")) || [] ;
            users.push({name : name , email: email , pass : pass})


            localStorage.setItem("users",JSON.stringify(users))
            location.assign("login.html")


            this.reset()


        })

        
    </script>
    
</body>
</html>
