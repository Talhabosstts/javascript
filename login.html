<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          body{
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

        }
        input{
            width: 250px;
            height: 50px;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
        }
        #btn{
            height: 40px;
            width: 180px;
            background-color: red;
            margin-top: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
        <h2>Login Page</h2>
    <form id="login">
        <!-- <input type="text" placeholder="Enter Your Name" id="name"><br> -->
        <input type="Email" placeholder="Enter Your Email" id="email"><br>
        <input type="password" placeholder="Enter Your Password" id="pass"><br>
        <button type="submit" id="btn">Login</button>
    </form>
    <script>
        let login = document.getElementById("login")
        login.addEventListener("submit", function(e){
            e.preventDefault()

            let email = document.getElementById("email").value;
            let pass = document.getElementById("pass").value;

            let users = JSON.parse(localStorage.getItem("users")) || [];

            let foundUser = users.find(u => u.email === email && u.pass === pass )

            if(foundUser){
                localStorage.setItem("loggedInUser", JSON.stringify(foundUser))

                alert("login completed")
                location.assign("welcome1.html")
            }
            else{
                alert("email id or password is incorrect")
                window.location.href = "login.html"
        }


        })
    </script>
    
</body>
</html>
